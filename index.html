
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #e50914;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: #1f2937;
            padding: 30px;
            border-radius: 15px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .section {
            margin-bottom: 30px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background: #374151;
            color: white;
        }

        .showtimes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .showtime {
            padding: 12px 20px;
            background: #374151;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .showtime:hover,
        .showtime.selected {
            background: #e50914;
            border-color: white;
        }

        .screen {
            background: white;
            color: #111;
            text-align: center;
            padding: 8px;
            margin: 20px auto;
            width: 80%;
            border-radius: 50% 50% 0 0;
        }

        .seats {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: auto;
        }

        .seat {
            background: #4b5563;
            padding: 12px 5px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .seat:hover {
            background: #6b7280;
        }

        .seat.selected {
            background: #22c55e;
        }

        .seat.booked {
            background: #ef4444;
            cursor: not-allowed;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .box {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            display: inline-block;
        }

        .available {
            background: #4b5563;
        }

        .selected-box {
            background: #22c55e;
        }

        .booked-box {
            background: #ef4444;
        }

        .summary {
            background: #111827;
            padding: 20px;
            border-radius: 10px;
        }

        .summary p {
            margin: 10px 0;
            font-size: 17px;
        }

        .book-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #b20710;
        }

        #confirmation {
            display: none;
            margin-top: 20px;
            background: #166534;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .seats {
                grid-template-columns: repeat(4, 1fr);
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 Movie Ticket Booking</h1>
</header>

<div class="container">

    <!-- Movie Selection -->
    <div class="section">
        <h2>1. Select Movie</h2>

        <select id="movie">
            <option value="Avengers: Endgame">Avengers: Endgame - ₹200</option>
            <option value="Interstellar">Interstellar - ₹180</option>
            <option value="Inception">Inception - ₹150</option>
            <option value="The Dark Knight">The Dark Knight - ₹220</option>
        </select>
    </div>

    <!-- Showtime -->
    <div class="section">
        <h2>2. Select Showtime</h2>

        <div class="showtimes">
            <div class="showtime" onclick="selectTime(this)">10:00 AM</div>
            <div class="showtime" onclick="selectTime(this)">1:30 PM</div>
            <div class="showtime" onclick="selectTime(this)">4:30 PM</div>
            <div class="showtime" onclick="selectTime(this)">7:30 PM</div>
            <div class="showtime" onclick="selectTime(this)">10:30 PM</div>
        </div>
    </div>

    <!-- Seat Selection -->
    <div class="section">
        <h2>3. Select Seats</h2>

        <div class="screen">SCREEN</div>

        <div class="seats" id="seats"></div>

        <div class="legend">
            <span><i class="box available"></i> Available</span>
            <span><i class="box selected-box"></i> Selected</span>
            <span><i class="box booked-box"></i> Booked</span>
        </div>
    </div>

    <!-- Summary -->
    <div class="section">
        <h2>4. Booking Summary</h2>

        <div class="summary">
            <p>Movie: <strong id="summaryMovie">Avengers: Endgame</strong></p>
            <p>Showtime: <strong id="summaryTime">Not selected</strong></p>
            <p>Seats: <strong id="summarySeats">None</strong></p>
            <p>Total: <strong>₹<span id="total">0</span></strong></p>

            <button class="book-btn" onclick="bookTickets()">
                Book Tickets
            </button>
        </div>

        <div id="confirmation">
            <h2>🎉 Booking Confirmed!</h2>
            <p id="confirmationText"></p>
        </div>
    </div>

</div>

<script>
    const seatsContainer = document.getElementById("seats");

    // Create 40 seats
    for (let i = 1; i <= 40; i++) {

        const seat = document.createElement("div");

        seat.classList.add("seat");
        seat.textContent = i;

        // Randomly mark some seats as booked
        if ([3, 8, 15, 22, 29, 35].includes(i)) {
            seat.classList.add("booked");
        }

        seat.addEventListener("click", function () {

            if (seat.classList.contains("booked")) {
                return;
            }

            seat.classList.toggle("selected");

            updateSummary();
        });

        seatsContainer.appendChild(seat);
    }

    // Select showtime
    function selectTime(element) {

        document.querySelectorAll(".showtime").forEach(time => {
            time.classList.remove("selected");
        });

        element.classList.add("selected");

        document.getElementById("summaryTime").textContent =
            element.textContent;

        updateSummary();
    }

    // Update movie
    document.getElementById("movie").addEventListener("change", function () {

        document.getElementById("summaryMovie").textContent =
            this.value;

        updateSummary();
    });

    function getPrice() {

        const movie = document.getElementById("movie").value;

        if (movie === "Avengers: Endgame") return 200;
        if (movie === "Interstellar") return 180;
        if (movie === "Inception") return 150;
        if (movie === "The Dark Knight") return 220;

        return 0;
    }

    function updateSummary() {

        const selectedSeats =
            document.querySelectorAll(".seat.selected");

        let seatNumbers = [];

        selectedSeats.forEach(seat => {
            seatNumbers.push(seat.textContent);
        });

        document.getElementById("summarySeats").textContent =
            seatNumbers.length > 0
                ? seatNumbers.join(", ")
                : "None";

        const total = seatNumbers.length * getPrice();

        document.getElementById("total").textContent = total;
    }

    function bookTickets() {

        const movie =
            document.getElementById("movie").value;

        const timeElement =
            document.querySelector(".showtime.selected");

        const selectedSeats =
            document.querySelectorAll(".seat.selected");

        if (!timeElement) {
            alert("Please select a showtime.");
            return;
        }

        if (selectedSeats.length === 0) {
            alert("Please select at least one seat.");
            return;
        }

        const seats = [];

        selectedSeats.forEach(seat => {
            seats.push(seat.textContent);

            // Mark seat as booked
            seat.classList.remove("selected");
            seat.classList.add("booked");
        });

        const total =
            seats.length * getPrice();

        document.getElementById("confirmation").style.display =
            "block";

        document.getElementById("confirmationText").innerHTML =
            `Movie: <strong>${movie}</strong><br>
             Showtime: <strong>${timeElement.textContent}</strong><br>
             Seats: <strong>${seats.join(", ")}</strong><br>
             Total Paid: <strong>₹${total}</strong>`;

        updateSummary();
    }
</script>

</body>
</html>
